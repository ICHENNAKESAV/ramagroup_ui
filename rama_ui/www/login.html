<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>window.csrf_token = "{{ csrf_token }}";</script>
    <script type="text/javascript" src="/assets/frappe/js/lib/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="/assets/frappe/js/frappe-web.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #ffffff; height: 100%; width: 100%; overflow-x: hidden; }
        .rama-login-wrapper { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        
        .rama-left-panel { flex: 1.5; background-color: #f8f9fa; display: block; position: relative; padding: 0; overflow: hidden; }
        .rama-logo { height: 75px; margin-bottom: 20px; display: block; }
        .rama-illustration { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .rama-right-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 10%; box-sizing: border-box; background: #fff; }
        .form-section { display: none; width: 100%; max-width: 450px; margin: 0 auto; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .welcome-title { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; color: #1D202B; margin-bottom: 8px; }
        .welcome-subtitle { font-size: 14px; color: #707684; margin-bottom: 30px; line-height: 1.5; }
        
        .tabs { display: flex; border-bottom: 1px solid #e2e8f0; margin-bottom: 30px; }
        .tab { padding: 10px 20px; font-size: 14px; font-weight: 500; color: #707684; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #00094b; border-bottom: 2px solid #00094b; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #1D202B; margin-bottom: 8px; }
        
        .form-control { width: 100%; padding: 12px 16px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px; color: #1D202B; box-sizing: border-box; transition: all 0.3s ease; }
        .form-control:focus { outline: none; border-color: #00094b; box-shadow: 0 0 0 3px rgba(0, 9, 75, 0.1); }
        
        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 40px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #707684; cursor: pointer; }
        
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 14px; }
        .remember-me { display: flex; align-items: center; gap: 8px; color: #1D202B; cursor: pointer; }
        .forgot-link { color: #00094b; text-decoration: underline; cursor: pointer; }
        
        .signup-text { font-size: 14px; color: #707684; margin-bottom: 20px; }
        .signup-text a { color: #00094b; text-decoration: underline; cursor: pointer; font-weight: 500; }
        
        .btn-primary-blue { width: 100%; padding: 12px; background: linear-gradient(135deg, #00094b, #001272); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 9, 75, 0.2); transition: all 0.3s ease; }
        .btn-primary-blue:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 9, 75, 0.3); }
        
        .page-card-body { margin-top: 15px; }
        .field-error { color: #d9534f; font-size: 12px; margin-top: 5px; display: none; }
        
        @media (max-width: 768px) {
            .rama-left-panel { flex: 1.5; background-color: #f8f9fa; display: block; position: relative; padding: 0; overflow: hidden; }
            .rama-right-panel { padding: 40px 20px; align-items: center; }
            .form-section { padding-top: 50px; }
            .rama-logo { height: 75px; margin-bottom: 20px; display: block; }
        }
    </style>
</head>
<body>
    <div class="rama-login-wrapper">
        <div class="rama-left-panel">
            <img src="/assets/rama_ui/images/login_illustration.jpg" alt="Illustration" class="rama-illustration">
        </div>
        
        <div class="rama-right-panel">
            <div style="width: 100%; max-width: 450px; margin: 0 auto; text-align: center;">
                <img src="/assets/rama_ui/assets/rama_logo.png" alt="Logo" class="rama-logo">
            </div>

            <!-- SIGN IN SECTION -->
            <section id="login-section" class="form-section active">
                <h1 class="welcome-title">Welcome to RAMA GROUP</h1>
                <p class="welcome-subtitle">Sign in to access</p>
                
                

                <form class="form-signin" role="form">
                    <div id="login-alert" style="display:none; background-color: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: center; font-weight: 500;"></div>
                    {% if not disable_user_pass_login %}
                    <div class="form-group">
                        <label for="login_email">Email address</label>
                        <input type="text" id="login_email" class="form-control" placeholder="Add your email" required autofocus autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="login_password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login_password" class="form-control" placeholder="Add your password" autocomplete="current-password" required>
                            <i class="fa-solid fa-eye toggle-password" data-target="login_password"></i>
                        </div>
                    </div>

                    <div class="form-actions" style="justify-content: flex-end;">
                        <a href="#forgot" class="forgot-link" onclick="showSection('forgot-section')">Forgot password?</a>
                    </div>

                    <button class="btn-primary-blue btn-login" id="btn-login-submit" type="submit">Sign in</button>
                    {% endif %}
                    <div class="llp-footer-attribution" style="text-align: center; margin-top: 25px; font-size: 13px; color: #707684;">
						Powered by <a href="http://www.hippoclouds.com" target="_blank" style="text-decoration: none; color: inherit; font-weight: 600; font-family: 'Aleo', serif; font-style: italic;"><span class="hippo-text" style="color: #0066FF !important;">hippo</span><span class="clouds-text" style="color: #F97316 !important;">cloud</span></a>
					</div>
                </form>
            </section>
            
            <!-- FORGOT PASSWORD SECTION -->
            <section id="forgot-section" class="form-section">
                <h1 class="welcome-title">Reset Password</h1>
                <p class="welcome-subtitle">Enter your registered email address to receive password reset instructions.</p>
                
                <form class="form-forgot" role="form">
                    <div class="form-group">
                        <label for="forgot_email">Email address</label>
                        <input type="email" id="forgot_email" class="form-control" placeholder="Add your email" required autofocus>
                    </div>

                    <div class="form-actions">
                        <a href="#login" class="forgot-link" onclick="showSection('login-section')"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
                    </div>

                    <button class="btn-primary-blue btn-login" id="btn-forgot-submit" type="submit">Send Reset Link</button>
                </form>
            </section>

        </div>
    </div>

    <!-- Initialization Script -->
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            window.location.hash = sectionId.replace('-section', '');
        }

        // Handle initial hash routing
        window.addEventListener('DOMContentLoaded', () => {
            // Redirect logged-in users to /app
            const getCookie = (name) => {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return unescape(parts.pop().split(';').shift());
                return null;
            };
            const userId = getCookie('user_id');
            if (userId && userId !== 'Guest' && window.location.pathname === '/') {
                let route = '/app';
                if (window.location.search) {
                    let urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get("redirect-to")) {
                        route = unescape(urlParams.get("redirect-to"));
                    }
                }
                window.location.href = route;
                return;
            }
            
            if(window.location.hash === '#forgot') {
                showSection('forgot-section');
            }
            
            // Password toggle logic
            document.querySelectorAll('.toggle-password').forEach(icon => {
                icon.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if(input.type === 'password') {
                        input.type = 'text';
                        this.classList.remove('fa-eye');
                        this.classList.add('fa-eye-slash');
                    } else {
                        input.type = 'password';
                        this.classList.remove('fa-eye-slash');
                        this.classList.add('fa-eye');
                    }
                });
            });


        });
        
        
        // Handle Login Submission
        const loginForm = document.querySelector('.form-signin');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('login_email').value;
                const password = document.getElementById('login_password').value;
                const btn = document.getElementById('btn-login-submit');
                const alertBox = document.getElementById('login-alert');
                
                btn.disabled = true;
                btn.innerText = 'Signing in...';
                alertBox.style.display = 'none';

                try {
                    const response = await fetch('/api/method/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ usr: email, pwd: password })
                    });

                    const data = await response.json();

                    if (response.ok && data.message === 'Logged In') {
                        let route = data.default_route || data.home_page || '/app';
                        if (route === '/') {
                            route = '/app';
                        }
                        
                        if (window.location.search) {
                            let urlParams = new URLSearchParams(window.location.search);
                            if (urlParams.get("redirect-to")) {
                                route = unescape(urlParams.get("redirect-to"));
                            }
                        }
                        
                        window.location.href = route;
                    } else {
                        let errorMessage = 'Invalid credentials, try again.';
                        if (data._server_messages) {
                            try {
                                const messages = JSON.parse(data._server_messages);
                                errorMessage = JSON.parse(messages[0]).message;
                            } catch(err) {}
                        }
                        alertBox.innerText = errorMessage;
                        alertBox.style.display = 'block';
                        btn.disabled = false;
                        btn.innerText = 'Sign in';
                    }
                } catch (err) {
                    alertBox.innerText = 'An error occurred during login. Please try again.';
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Sign in';
                }
            });
        }

        // Handle Forgot Password Submission
        const forgotForm = document.querySelector('.form-forgot');
        if (forgotForm) {
            forgotForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('forgot_email').value;
                const btn = document.getElementById('btn-forgot-submit');
                
                btn.disabled = true;
                btn.innerText = 'Sending...';

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body: new URLSearchParams({ cmd: 'frappe.core.doctype.user.user.reset_password', user: email })
                    });
                    
                    alert('If an account exists, a password reset link has been sent.');
                    btn.disabled = false;
                    btn.innerText = 'Send Reset Link';
                    showSection('login-section');
                } catch (err) {
                    alert('An error occurred. Please try again.');
                    btn.disabled = false;
                    btn.innerText = 'Send Reset Link';
                }
            });
        }

        // Listen to hash changes
        window.addEventListener('hashchange', () => {
            if(window.location.hash === '#forgot') showSection('forgot-section');
            else if(window.location.hash === '#login' || window.location.hash === '') showSection('login-section');
        });
    </script>
</body>
</html>
